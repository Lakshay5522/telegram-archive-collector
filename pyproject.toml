[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "telegram-archive-collector"
version = "1.3.1"
description = "Collect Telegram group messages with Telethon and forward them to a private channel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishal Verma" }]

# Pinned to compatible ranges: minor upgrades are safe, majors need a review.
dependencies = [
  "telethon>=1.34,<2.0",
  "aiosqlite>=0.19,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
telegram-collector = "collector.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: takes a second or more (chaos runs, full self-test); skip with -m 'not slow'",
]
filterwarnings = ["error::DeprecationWarning:collector.*"]

[tool.vercel]
# Vercel looks for a module-level ASGI object; the dashboard is exported there.
entrypoint = "app:app"

[tool.ruff]
line-length = 110
target-version = "py311"
